<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ page.title }} · 핏챠</title>
<style>
  :root { color-scheme: light dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 28px 18px 72px;
    font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
    line-height: 1.75; font-size: 16px; word-break: keep-all;
    color: #24292f; background: #fff;
    -webkit-text-size-adjust: 100%;
  }
  .wrap { max-width: 720px; margin: 0 auto; }
  h1 { font-size: 1.5rem; margin: 0 0 6px; letter-spacing: -0.01em; }
  h2 { font-size: 1.12rem; margin: 34px 0 10px; padding-top: 14px; border-top: 1px solid #e5e7eb; }
  h3 { font-size: 1rem; margin: 22px 0 8px; }
  p, li { font-size: 0.95rem; }
  ul, ol { padding-left: 1.3em; }
  li { margin: 4px 0; }
  a { color: #1f6feb; }
  code { background: #f3f4f6; padding: 1px 5px; border-radius: 4px; font-size: 0.88em; }
  blockquote {
    margin: 14px 0; padding: 10px 14px;
    border-left: 3px solid #d0d7de; background: #f6f8fa;
    color: #57606a; font-size: 0.9rem;
  }
  blockquote p { margin: 0; }
  /* 표는 좁은 화면에서 가로로만 스크롤한다 — 본문이 밀리지 않게 */
  .tw { overflow-x: auto; margin: 14px 0; -webkit-overflow-scrolling: touch; }
  table { border-collapse: collapse; width: 100%; font-size: 0.88rem; }
  th, td { border: 1px solid #d0d7de; padding: 8px 10px; text-align: left; vertical-align: top; }
  th { background: #f6f8fa; font-weight: 600; white-space: nowrap; }
  hr { border: 0; border-top: 1px solid #e5e7eb; margin: 40px 0 0; }
  .nav { font-size: 0.85rem; color: #57606a; margin-bottom: 22px; }
  .nav a { margin-right: 12px; }
  .upd { font-size: 0.82rem; color: #6e7781; margin: 0 0 26px; }
  /* 사업자 정보 — 작은 회색 소자 (사용자 확정 표기) */
  .biz { margin-top: 18px; font-size: 0.76rem; line-height: 1.85; color: #8b949e; }
  .biz a { color: #8b949e; }
  @media (prefers-color-scheme: dark) {
    body { color: #e6edf3; background: #0d1117; }
    h2 { border-top-color: #21262d; }
    a { color: #58a6ff; }
    code { background: #161b22; }
    blockquote { border-left-color: #30363d; background: #161b22; color: #8b949e; }
    th, td { border-color: #30363d; }
    th { background: #161b22; }
    hr { border-top-color: #21262d; }
    .nav, .upd { color: #8b949e; }
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="nav"><a href="{{ '/' | relative_url }}">핏챠</a><a href="{{ '/terms/' | relative_url }}">이용약관</a><a href="{{ '/privacy/' | relative_url }}">개인정보처리방침</a></div>
  <h1>{{ page.title }}</h1>
  {% if page.updated %}<p class="upd">시행일 {{ page.updated }}</p>{% endif %}
  {{ content }}
</div>
<script>
  // 표를 가로 스크롤 상자로 감싼다 — 좁은 화면에서 표 때문에 본문이 밀리는 것을 막는다
  document.querySelectorAll('table').forEach(function (t) {
    var d = document.createElement('div'); d.className = 'tw';
    t.parentNode.insertBefore(d, t); d.appendChild(t);
  });
</script>
</body>
</html>
